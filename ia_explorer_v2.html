<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>IA Explorer</title>
<style>
:root{color-scheme:light dark;
--bg:light-dark(#eef2ff,#10152b);--surface:light-dark(#fff,#1b2243);--surface2:light-dark(#e8ecff,#252e57);
--text:light-dark(#17203a,#f5f7ff);--muted:light-dark(#566280,#b8c1dc);
--accent:light-dark(#5b55e8,#8d88ff);--on-accent:light-dark(#fff,#10152b);
--ok:light-dark(#0f9d58,#4be08a);--bad:light-dark(#e0475b,#ff8a98);--gold:#ffb703;
--line:color-mix(in srgb,var(--text) 14%,transparent);--shadow:0 12px 30px #0000001f;--w:var(--accent)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Nunito","Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.45;color:var(--text);
background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--accent) 20%,transparent),transparent 42%),radial-gradient(circle at 95% 18%,color-mix(in srgb,#ff4d8d 16%,transparent),transparent 36%),radial-gradient(circle at 50% 100%,color-mix(in srgb,#00b894 16%,transparent),transparent 40%),var(--bg);background-attachment:fixed;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px;border-radius:12px}
main{max-width:1040px;margin:auto;padding:14px 5vw 50px}
main:focus{outline:none}
h1,h2,h3{line-height:1.15;margin:.2em 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 5vw;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px)}
.brand{background:none;font-weight:900;font-size:1.3rem;display:flex;align-items:center;gap:8px;padding:4px}
.brand span.a{color:var(--accent)}
.logo{font-size:1.6rem}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{padding:8px 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:800;font-size:.95rem}
.tool[aria-pressed=false]{opacity:.55;text-decoration:line-through}
/* boutons */
.btn{font-weight:800;border-radius:18px;padding:13px 24px;min-height:52px;background:var(--accent);color:var(--on-accent);box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 55%,#000);transition:transform .12s,box-shadow .12s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn.alt{background:var(--surface);color:var(--text);box-shadow:0 5px 0 var(--line),inset 0 0 0 2px var(--line)}
.btn.sm{min-height:44px;padding:8px 16px;font-size:.95rem}
.btn.big{font-size:1.15rem;padding:15px 32px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.card{background:var(--surface);border-radius:24px;padding:20px;box-shadow:var(--shadow);border:2px solid var(--line)}
.card+.card,.card+.choices,.choices+.card,.card+.flips{margin-top:16px}
.instruction,.small{color:var(--muted)}
.small{font-size:.9rem}
/* accueil */
.hero{text-align:center;padding:18px 0 10px}
.hero-pix{display:flex;justify-content:center}
.hero h1{font-size:clamp(2.4rem,8vw,4.6rem);letter-spacing:-1px}
.hero h1 span{background:linear-gradient(90deg,#ff7a59,#ff4d8d,#7c5cff,#2d9cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{font-size:1.2rem;color:var(--muted);max-width:640px;margin:6px auto 20px}
.setup{max-width:520px;margin:0 auto 22px;text-align:left}
.setup label,.setup legend{font-weight:800;display:block;margin-bottom:6px}
.setup input{width:100%;padding:12px 16px;border-radius:14px;border:3px solid var(--line);background:var(--bg);font-weight:700}
.setup fieldset{border:0;padding:0;margin:16px 0 0}
.seg{display:flex;gap:10px}
.seg button{flex:1;padding:12px;border-radius:16px;background:var(--surface2);font-weight:800;border:3px solid transparent}
.seg button[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--surface))}
/* carte */
.maphead{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;margin:10px 0}
.rank{background:var(--surface);padding:10px 18px;border-radius:999px;font-weight:900;box-shadow:var(--shadow)}
.stats{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.badge{padding:9px 14px;border-radius:999px;background:var(--surface2);font-weight:800}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px;margin-top:16px}
.world{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;border-top:8px solid var(--w);transition:transform .2s}
.world:hover:not(.locked){transform:translateY(-4px)}
.world .btn{grid-column:1/-1}
.tile{width:68px;height:68px;border-radius:22px;background:var(--w);display:grid;place-items:center;font-size:2.2rem;box-shadow:0 5px 0 color-mix(in srgb,var(--w) 60%,#000)}
.num{font-size:.8rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.world h3{font-size:1.15rem;margin:0}
.world p{margin:2px 0;color:var(--muted);font-size:.95rem}
.mstars{color:var(--gold);font-size:1.3rem;letter-spacing:2px}
.locked{opacity:.6;filter:grayscale(.7)}
.next{outline:4px dashed var(--w);outline-offset:4px;animation:wob 2.4s ease-in-out infinite}
/* jeu */
.game{max-width:860px;margin:6px auto}
.gbar{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.gtitle{font-size:1.4rem;margin:0}
.progwrap small{color:var(--muted);font-weight:700}
.prog{height:14px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:var(--w);border-radius:99px;transition:width .45s}
.coach{display:flex;gap:10px;align-items:flex-end;margin:14px 0 16px}
.mascot{flex:none;width:100px}
.bubble{position:relative;flex:1;background:var(--surface);border:3px solid var(--w);border-radius:24px 24px 24px 6px;padding:14px 16px;font-weight:700;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.bubble:before{content:"";position:absolute;left:-14px;bottom:10px;border:9px solid transparent;border-right:14px solid var(--w)}
.mini{background:var(--surface2);border-radius:12px;width:44px;height:44px;flex:none;font-size:1.2rem}
.prompt{text-align:center}
.bigemoji{font-size:5rem;line-height:1.1;animation:floaty 3s ease-in-out infinite}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:14px;margin:18px 0}
.choices.two{grid-template-columns:1fr 1fr}
.choices.col{grid-template-columns:1fr}
.choice{position:relative;min-height:84px;padding:14px;border-radius:22px;border:3px solid var(--line);background:var(--surface);font-weight:800;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;transition:transform .15s,border-color .15s}
.choice .em{font-size:2.3rem;line-height:1}
.choice small{font-weight:700;color:var(--muted);font-size:.85rem}
.choice.wide{flex-direction:row;justify-content:flex-start;text-align:left;gap:14px}
.choice:hover:not(:disabled){border-color:var(--w);transform:translateY(-3px)}
.choice:disabled{cursor:default;color:var(--text)}
.choice:disabled:not(.right):not(.wrong):not(.sel){opacity:.55}
.choice.sel{border-color:var(--w);background:color-mix(in srgb,var(--w) 20%,var(--surface))}
.choice.right{background:color-mix(in srgb,var(--ok) 22%,var(--surface));border-color:var(--ok)}
.choice.wrong{background:color-mix(in srgb,var(--bad) 18%,var(--surface));border-color:var(--bad);animation:shake .4s}
.choice.right:after{content:"✅";position:absolute;top:6px;right:10px}
.choice.wrong:after{content:"❌";position:absolute;top:6px;right:10px}
.shake{animation:shake .4s}
.fb{display:flex;gap:14px;align-items:flex-start;border-radius:22px;padding:16px 18px;margin-top:16px;animation:pop .3s}
.fb.good{background:color-mix(in srgb,var(--ok) 16%,var(--surface));border:3px solid var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--gold) 20%,var(--surface));border:3px solid var(--gold)}
.fb .ico{font-size:2rem;line-height:1}
.nextrow{text-align:center;margin-top:14px}
/* éléments de jeux */
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:14px;margin-top:16px}
.flip{padding:16px;border-radius:22px;background:var(--surface);border:3px solid var(--line);box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;min-height:170px;justify-content:center}
.flip .em{font-size:2.6rem}
.flip .fd{font-size:.9rem;color:var(--muted);font-weight:700}
.flip.open{border-color:var(--w);background:color-mix(in srgb,var(--w) 14%,var(--surface))}
.bank{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px;margin:14px 0}
.ex{font-size:2.4rem;padding:12px;border-radius:20px;background:var(--surface);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.ex:disabled{opacity:.3;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap;min-height:48px;margin:8px 0}
.chip{padding:6px 14px;border-radius:999px;background:var(--surface2);font-weight:800;animation:pop .25s}
.empty{color:var(--muted);font-style:italic}
.seq{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:2.4rem;font-weight:900}
.seq span{min-width:62px;height:62px;display:grid;place-items:center;background:var(--surface2);border-radius:18px;padding:0 6px}
.seq span.q{background:var(--w);color:#fff;animation:wob 1.6s infinite}
.tl{margin:0 0 16px;padding:0;list-style:none;border-left:5px solid var(--w);margin-left:12px}
.tl li{position:relative;margin:0 0 12px 22px;padding:12px 14px;background:var(--surface);border-radius:18px;border:2px solid var(--line);animation:pop .3s}
.tl li:before{content:"";position:absolute;left:-36px;top:18px;width:18px;height:18px;border-radius:50%;background:var(--w);border:4px solid var(--bg)}
.tl b.y{display:inline-block;background:var(--w);color:#fff;border-radius:10px;padding:0 10px;margin-right:6px}
.sel-group{margin:0 0 14px;border:0;padding:0}
.sel-group legend{font-weight:900;margin-bottom:6px}
.sel-group .choices{margin:6px 0;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}
.sel-group .choice{min-height:72px;font-size:.95rem}
.story{font-size:1.15rem}
.codebox{background:var(--surface2);border-radius:14px;padding:10px 14px;font-family:ui-monospace,Consolas,monospace;font-size:.9rem;margin:10px 0}
.dots span{display:inline-block;animation:floaty 1s infinite;font-size:2rem}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
.meter{height:14px;background:var(--surface2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--w);transition:width .3s}
.res{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:16px;background:var(--surface2);margin:8px 0;font-weight:800;animation:pop .3s}
.res .big{font-size:2.4rem}
/* victoire */
.win{text-align:center}
.bigstars{font-size:3.6rem;letter-spacing:6px}
.bigstars span{display:inline-block;color:var(--line)}
.bigstars span.on{color:var(--gold);animation:starIn .6s both}
.unlock{display:grid;gap:10px;margin-top:14px;text-align:left}
.unlock .w{background:var(--surface2);border-radius:16px;padding:10px 14px;border-left:6px solid var(--w)}
.learn{background:color-mix(in srgb,var(--w) 14%,var(--surface));border-radius:18px;padding:12px 16px;margin:14px 0;font-weight:700}
/* dico et diplôme */
.dict{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;margin-top:14px}
.dict .card{border-top:6px solid var(--w)}
.dict h3{display:flex;gap:8px;align-items:center}
.diploma{text-align:center;border:10px double var(--gold);border-radius:28px;padding:28px 20px;background:var(--surface);box-shadow:var(--shadow);max-width:720px;margin:14px auto}
.diploma h1{font-size:clamp(2rem,6vw,3.2rem);color:var(--accent)}
.dip-name{font-size:clamp(2rem,7vw,3.4rem);font-weight:900;border-bottom:4px dotted var(--line);display:inline-block;padding:0 24px;margin:6px 0 12px}
.footer{text-align:center;color:var(--muted);padding:26px 5vw;font-size:.95rem}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.prompt{position:relative}
.qsay{position:absolute;top:10px;right:10px}
.sayb{position:absolute;top:10px;right:10px}
.dict .card,.unlock .w,.learn{position:relative;padding-right:64px}
.unlock .w{padding:10px 64px 10px 14px}
.wardrobe .card{text-align:center;padding-right:20px}
.wardrobe .card .skinprev{display:flex;justify-content:center;min-height:120px}
.wardrobe .locked .skinprev{filter:grayscale(1) brightness(.7)}
.newskin{display:flex;gap:14px;align-items:center;background:color-mix(in srgb,var(--gold) 22%,var(--surface));border:3px solid var(--gold);border-radius:20px;padding:12px 16px;margin-top:14px;text-align:left;animation:pop .4s}
/* mascotte */
.pix{animation:bob 3s ease-in-out infinite;overflow:visible}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.ant{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.mascot.pop,.hero-pix.pop{animation:pop .35s}
@keyframes bob{50%{transform:translateY(-6px) rotate(1.5deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes pulse{50%{transform:scale(1.3);opacity:.7}}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes floaty{50%{transform:translateY(-8px)}}
@keyframes wob{50%{transform:rotate(-1.2deg) scale(1.015)}}
@keyframes starIn{from{transform:scale(0) rotate(-120deg)}to{transform:scale(1) rotate(0)}}
@media (max-width:560px){body{font-size:17px}.mascot{width:72px}.bubble{padding:12px}.brand .a2{display:none}.choices.two{grid-template-columns:1fr 1fr}.bigemoji{font-size:4rem}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media print{body{background:#fff!important;color:#000}.top,.footer,.noprint,#confetti{display:none!important}.diploma{box-shadow:none;border-color:#caa000;break-inside:avoid}}
</style>
</head>
<body>
<header class="top">
  <button class="brand" onclick="home()" aria-label="Retour à l’accueil"><span class="logo" aria-hidden="true">🤖</span><span>IA <span class="a">EXPLORER</span></span></button>
  <div class="tools">
    <span class="pill" title="Tes étoiles">⭐ <b id="stars">0</b></span>
    <button class="pill tool" id="tsound" aria-pressed="true" onclick="toggle('sound')">🔔 Sons</button>
    <button class="pill tool" id="tvoice" aria-pressed="false" onclick="toggle('voice')">🗣️ Voix</button>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<footer class="footer">Une aventure pour comprendre l’IA — apprendre, tester, vérifier 🤝</footer>
<canvas id="confetti" aria-hidden="true"></canvas>
<noscript><p style="padding:20px">Active JavaScript pour jouer à IA Explorer.</p></noscript>
<script>
'use strict';
/* ---------- Outils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const M=$('#main');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const wait=(ms,f)=>setTimeout(f,RM?Math.min(ms,50):ms);

/* ---------- État (sauvegardé uniquement sur cet appareil) ---------- */
const KEY='iaExplorer.v2';
let S={name:'',mode:'8-10',sound:true,voice:false,best:{},skin:'base'};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const done=i=>(S.best[i]||0)>0;
const totalStars=()=>Object.values(S.best).reduce((a,b)=>a+b,0);
const young=()=>S.mode==='8-10';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}renderTools()}
function renderTools(){
  $('#stars').textContent=totalStars();
  const a=$('#tsound'),b=$('#tvoice');
  a.setAttribute('aria-pressed',S.sound);a.textContent=(S.sound?'🔔':'🔕')+' Sons';
  b.setAttribute('aria-pressed',S.voice);b.textContent='🗣️ Voix';
}
function toggle(k){S[k]=!S[k];save();if(k==='voice'){S.voice?speak('La voix de PIX est activée !'):speechSynthesis&&speechSynthesis.cancel()}else sfx.tap()}

/* ---------- Sons (synthétisés, aucun fichier) ---------- */
let ac;
function tone(seq,type='triangle',vol=.14){
  if(!S.sound)return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    let t=ac.currentTime;
    seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);t+=d*.85});
  }catch(e){}
}
const sfx={tap:()=>tone([[660,.06]],'sine',.07),ok:()=>tone([[523,.1],[659,.1],[784,.2]]),no:()=>tone([[300,.14],[220,.24]],'sawtooth',.06),win:()=>tone([[523,.12],[659,.12],[784,.12],[1047,.34]])};

/* ---------- Voix (synthèse vocale du navigateur) ---------- */
/* Noms parlés des emojis utilisés dans les questions (sinon ils seraient muets) */
const EMO={'🔴':'rouge','🔵':'bleu','🟢':'vert','🐱':'chat','🐶':'chien','🐭':'souris','⭐':'étoile','🌙':'lune','☀':'soleil','🍎':'pomme','🍏':'pomme verte','🍌':'banane','🍊':'orange','🍇':'raisin','🌩':'orage','💨':'vent','☔':'pluie','🏖':'plage','⛄':'bonhomme de neige'};
const EMO_RE=new RegExp(Object.keys(EMO).join('|'),'g');
function speak(t){
  if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();
    t=String(t).replace(/️/g,'').replace(EMO_RE,m=>' '+EMO[m]+', ');
    const u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,'').replace(/[\p{Extended_Pictographic}️‍]/gu,'').replace(/\s+/g,' ').trim());
    u.lang='fr-FR';u.rate=.95;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}
}

/* ---------- Confettis ---------- */
const parts=[];let confettiOn=false;
function burst(n=90){
  if(RM)return;
  const c=$('#confetti'),cols=['#ff7a59','#7c5cff','#00b894','#ff4d8d','#f5a623','#2d9cff'];
  c.width=innerWidth;c.height=innerHeight;
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*240,y:innerHeight*.4,vx:(Math.random()-.5)*15,vy:-Math.random()*14-3,s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]});
  if(confettiOn)return;confettiOn=true;
  const x=c.getContext('2d');
  (function tick(){
    x.clearRect(0,0,c.width,c.height);
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      if(p.y>c.height+20){parts.splice(i,1);continue}
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()}
    if(parts.length)requestAnimationFrame(tick);else{confettiOn=false;x.clearRect(0,0,c.width,c.height)}
  })();
}

/* ---------- PIX, la mascotte ---------- */
/* Costumes : back = derrière la tête, mid = sur le visage (sous les yeux), front = par-dessus */
const SK={
  base:{},
  explorer:{front:'<ellipse cx="50" cy="25" rx="37" ry="6.5" fill="#c8923f"/><path d="M29 25q0-22 21-22t21 22z" fill="#d9a54f"/><rect x="29" y="17" width="42" height="6" fill="#8a5a2b"/>'},

let G=null,cur='';
function frame(i){
  const w=worlds[i];G={i,mist:0,total:1,tries:0};cur='';
  view(`<section class="game" style="--w:${w.c}">
    <div class="gbar"><button class="btn alt sm" onclick="showMap()">← Carte</button><h2 class="gtitle"><span aria-hidden="true">${w.e}</span> ${w.t}</h2></div>

    <div id="stage"></div><div id="fb" aria-live="polite"></div></section>`);
  $('#hear').onclick=()=>speak(cur);
}
function mascot(mood){const m=$('#mascot');if(!m)return;m.innerHTML=pix(mood,96);m.classList.remove('pop');void m.offsetWidth;m.classList.add('pop')}
function say(msg,mood='happy'){cur=msg;$('#say').textContent=msg;mascot(mood);if(S.voice)speak(msg)}
/* Pose une pastille 🔊 sur la question en cours et la lit seule si la voix est activée */
function ask(text,pre='',auto=true){
  const c=$('#stage .prompt');
  if(c&&!c.querySelector('.qsay')){c.insertAdjacentHTML('afterbegin','<button class="mini qsay" aria-label="Écouter la question">🔊</button>');c.querySelector('.qsay').onclick=()=>speak(text)}
  cur=text;if(S.voice&&auto)speak(pre+text);
}
function setProg(k,n){$('#prog').innerHTML=`<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${k}"><i style="width:${k/n*100}%"></i></div><small>${k<n?'Étape '+(k+1)+' sur '+n:'Terminé !'}</small>`}
function lock(){document.querySelectorAll('#stage .choice').forEach(b=>b.disabled=true)}

function verdict(ok,msg,next,btn='Suivant ➜'){
  let t;
  if(ok){sfx.ok();burst(30);t=pick(['Bravo !','Super !','Bien joué !','Excellent !','Yes !'])}
  else{G.mist++;sfx.no();t=pick(['Oups !','Pas tout à fait…','Presque !','Aïe !'])}
  mascot(ok?'cheer':'oops');
  $('#fb').innerHTML=`<div class="fb ${ok?'good':'bad'}"><div class="ico" aria-hidden="true">${ok?'✅':'💡'}</div><div><b>${t}</b> ${msg}</div></div><div class="nextrow"><button class="btn big" id="nextb">${btn}</button></div>`;
  const nb=$('#nextb');nb.onclick=()=>{sfx.tap();next()};nb.focus({preventScroll:true});
  if(S.voice)speak(t+' '+msg);
  $('#fb').scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'});
}
/* decide(bouton) -> vrai si c’est la bonne réponse */
function bindChoices(decide,why,next){
  const bs=[...document.querySelectorAll('#stage .choice')];
  bs.forEach(b=>b.onclick=()=>{
    const ok=decide(b);lock();b.classList.add(ok?'right':'wrong');
    if(!ok){const r=bs.find(decide);if(r)r.classList.add('right')}
    verdict(ok,typeof why==='function'?why(b,ok):why,next)});
}
function win(i,total=G.total){
  const m=G.mist;
  winStars(i,m<=Math.floor(total*.15)?3:m<=Math.floor(total*.4)?2:1);
}
function winStars(i,st){
  const first=!done(i),w=worlds[i],skin=skins.find(k=>k.w===i);
  S.best[i]=Math.max(S.best[i]||0,st);save();
  const words=dict.filter(d=>d.w===i);
  const msg=st===3?'Parfait, quasiment aucune erreur !':st===2?'Très bien joué !':'Tu as réussi ! Rejoue pour gagner plus d’étoiles.';
  $('#prog').innerHTML=`<div class="prog"><i style="width:100%"></i></div>`;$('#fb').innerHTML='';
  $('#stage').innerHTML=`<div class="card win"><div class="bigstars" role="img" aria-label="${st} étoile${st>1?'s':''} sur 3">${[1,2,3].map(n=>`<span class="${n<=st?'on':''}" style="animation-delay:${n*.25}s">★</span>`).join('')}</div>
    <h2>Monde terminé !</h2><p>${msg}</p>
    <div class="learn" style="text-align:left">${sayBtn('À retenir : '+w.k)}💡 À retenir : ${w.k}</div>
    ${first?`<div class="unlock"><b>📚 Nouveau${words.length>1?'x':''} mot${words.length>1?'s':''} dans ton dictionnaire :</b>${words.map(d=>`<div class="w" style="--w:${w.c}">${sayBtn(d.t+'. '+d.d)}<b>${d.e} ${d.t}</b><br>${d.d}</div>`).join('')}</div>`:''}
    ${first&&skin?`<div class="newskin"><div>${pix('cheer',84,skin.id)}</div><div style="flex:1"><b>🎁 Nouveau costume : ${skin.n} !</b><br><button class="btn sm" id="wear">👕 Le mettre</button></div></div>`:''}
    <div class="btnrow"><button class="btn big" id="go">${i<6?'Monde suivant ➜':'🎓 Mon diplôme'}</button><button class="btn alt" id="again">↻ Rejouer</button><button class="btn alt" id="map">🗺️ Carte</button></div></div>`;
  $('#go').onclick=()=>i<6?play(i+1):diploma();$('#again').onclick=()=>play(i);$('#map').onclick=showMap;
  if($('#wear'))$('#wear').onclick=()=>{wear(skin.id);$('#wear').textContent='✓ Porté !';$('#wear').disabled=true};
  sfx.win();burst(170);say(`${S.name?S.name+', ':''}${msg} ${w.k}${first&&skin?' Tu as débloqué un nouveau costume pour PIX !':''}`,'cheer');
  $('#go').focus({preventScroll:true});
}

/* ---------- Monde 3 : entraîner PIX ---------- */
function g3(){
  frame(2);
  const budget=young()?6:5;
  const bank=shuffle([['🍎','pomme rouge'],['🍎','pomme rouge'],['🍎','pomme rouge'],['🍏','pomme verte'],['🍌','banane'],['🍌','banane'],['🍌','banane'],['🍊','orange'],['🍊','orange'],['🍊','orange']]);
  const labelOf={'pomme rouge':'pomme','pomme verte':'pomme','banane':'banane','orange':'orange'};
  let chosen=new Set();
  function setup(){
    G.tries++;chosen=new Set();$('#fb').innerHTML='';$('#prog').innerHTML='';
    say(`PIX doit apprendre à reconnaître des fruits. Choisis ${budget} images pour l’entraîner. Pense à bien varier !`,'happy');
    $('#stage').innerHTML=`<div class="card"><b>📦 La boîte d’exemples</b> <span class="small">— touche une image pour la donner à PIX</span><div class="bank" id="bank"></div></div>
      <div class="card"><b>🧠 Ce que PIX a appris</b><div class="chips" id="bag"></div><div class="meter"><i id="bar"></i></div><small id="cnt"></small></div>
      <div class="btnrow"><button class="btn big" id="test">🧪 Tester PIX</button><button class="btn alt" id="clear">↺ Vider</button></div>`;
    $('#test').onclick=runTest;$('#clear').onclick=()=>{chosen.clear();paint()};paint();
  }
  function paint(){
    $('#bank').innerHTML=bank.map((b,i)=>`<button class="ex" data-i="${i}" aria-label="Exemple : ${b[1]}" ${chosen.has(i)||(chosen.size>=budget)?'disabled':''}>${b[0]}</button>`).join('');
    $('#bag').innerHTML=chosen.size?[...chosen].map(i=>`<button class="chip" data-i="${i}" aria-label="Retirer ${bank[i][1]}">${bank[i][0]} ${labelOf[bank[i][1]]} ✕</button>`).join(''):'<span class="empty">PIX ne sait encore rien…</span>';
    $('#bar').style.width=chosen.size/budget*100+'%';$('#cnt').textContent=`${chosen.size} / ${budget} exemples`;$('#test').disabled=chosen.size<2;
    document.querySelectorAll('.ex').forEach(b=>b.onclick=()=>{sfx.tap();chosen.add(+b.dataset.i);paint();if(chosen.size===1)say('Bien ! Plus il y a d’exemples différents, mieux PIX apprend.','happy');else if(S.voice)speak(bank[+b.dataset.i][1])});
    document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{chosen.delete(+b.dataset.i);paint()});
  }
  function runTest(){
    const seen=new Set([...chosen].map(i=>bank[i][1]));
    const tests=shuffle([['🍏','pomme verte'],['🍎','pomme rouge'],['🍊','orange'],['🍌','banane']]);
    say('PIX regarde de nouvelles images… Va-t-il les reconnaître ?','think');
    $('#stage').innerHTML=`<div class="card"><b>🧪 Le test de PIX</b><div id="res"></div></div>`;
    let score=0;
    tests.forEach(([e,l],k)=>wait(700*(k+1),()=>{
      const ok=seen.has(l);if(ok)score++;ok?sfx.ok():sfx.no();
      if(S.voice)speak(ok?`C’est une ${labelOf[l]} !`:'Je n’ai jamais vu ça…');
      $('#res').insertAdjacentHTML('beforeend',`<div class="res"><span class="big" aria-hidden="true">${e}</span><span>${ok?`PIX dit : « C’est une ${labelOf[l]} ! » ✅`:'PIX hésite : « Je n’ai jamais vu ça… » 🤔❌'}</span></div>`);
      if(k===tests.length-1)wait(600,()=>end(score,tests.filter(t=>!seen.has(t[1]))));
    }));
  }
  function end(score,missing){
    const pass=score>=3,stars=score===4?(G.tries<=1?3:2):1;
    mascot(pass?'cheer':'oops');
    const hint=missing.length?`PIX n’a jamais vu : <b>${missing.map(m=>m[0]+' '+m[1]).join(', ')}</b>. `:'';
    const text=score===4?'PIX a tout reconnu : tes exemples étaient bien variés !':pass?`Pas mal, mais ${hint}Une IA ne reconnaît bien que ce qu’elle a déjà vu : c’est un <b>biais</b> dans les données.`:`${hint}Une IA ne reconnaît bien que ce qu’elle a déjà vu. Essaie avec des exemples plus variés !`;
    $('#fb').innerHTML=`<div class="fb ${pass?'good':'bad'}"><div class="ico" aria-hidden="true">${pass?'✅':'💡'}</div><div><b>Score : ${score} / 4.</b> ${text}</div></div>
      <div class="btnrow">${pass?`<button class="btn big" id="ok">Continuer ➜</button>`:''}<button class="btn ${pass?'alt':'big'}" id="retry">↻ ${pass?'Faire mieux':'Réessayer'}</button></div>`;
    if(pass)$('#ok').onclick=()=>winStars(2,stars);
    $('#retry').onclick=setup;
    cur=text.replace(/<[^>]+>/g,'');if(S.voice)speak(cur);
    $('#fb').scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'});
  }
  setup();
}

      why:'La capitale du Maroc est Rabat. Une IA peut inventer une réponse fausse qui a l’air vraie : c’est une hallucination. Il faut vérifier.'},
    {e:'🔒',q:'Un chatbot te demande ton adresse et le nom de ton école « pour mieux te connaître ». Que fais-tu ?',
      o:[{t:'Je lui donne, il est gentil.',no:'Même s’il paraît gentil, tu ne sais pas où vont ces informations.'},{t:'Je ne donne rien et j’en parle à un adulte.',ok:1},{t:'Je donne seulement le nom de ma rue.',no:'Une partie de l’adresse reste une information personnelle.'}],
      why:'Les informations personnelles (adresse, école, photos, mots de passe) se protègent. On n’en donne pas à une IA.'},
    {e:'📝',q:'Tu dois faire un exposé sur les volcans. Comment utiliser l’IA intelligemment ?',
      o:[{t:'Je lui demande de tout faire et je rends sans lire.',no:'Tu n’apprendrais rien, et le texte pourrait contenir des erreurs.'},{t:'Je l’utilise pour comprendre, je vérifie, puis j’écris avec mes mots.',ok:1},{t:'Je n’utilise aucune autre source.',no:'Mieux vaut comparer plusieurs sources.'}],
      why:'L’IA peut t’aider à comprendre, mais c’est toi qui vérifies et qui réfléchis. Le dernier mot est le tien.'},
    {e:'🦈',q:'Tu vois une photo incroyable : un requin dans une piscine d’école. Elle a peut-être été créée par une IA. Que fais-tu ?',
      o:[{t:'Je la partage tout de suite à tout le monde.',no:'Partager une fausse image peut tromper beaucoup de gens.'},{t:'Je cherche d’où elle vient et j’en parle à un adulte.',ok:1},{t:'C’est une photo, donc c’est forcément vrai.',no:'Une IA peut fabriquer des images très réalistes.'}],
      why:'Les IA peuvent créer de fausses images très crédibles. Avant de croire ou de partager, on vérifie la source.'},
    {e:'⚖️',q:'Une IA a appris surtout avec des photos d’un seul type de personnes. Quel problème peut arriver ?',
      o:[{t:'Elle reconnaîtra moins bien les autres personnes.',ok:1},{t:'Aucun, une IA est toujours juste.',no:'Une IA reflète les données qu’on lui a données.'},{t:'Elle va devenir plus rapide.',no:'Les données incomplètes ne rendent pas l’IA plus rapide.'}],
      why:'Si les données ne sont pas variées, l’IA se trompe plus sur ce qu’elle a peu vu : c’est un biais.'},
    {e:'🧸',q:'Un robot de compagnie te dit : « Je suis triste pour toi. » Qu’est-ce qui est vrai ?',
      o:[{t:'Il ressent exactement comme un humain.',no:'Il n’a ni cœur ni émotions comme nous.'},{t:'Il imite l’empathie avec des mots, mais ne ressent pas comme un humain.',ok:1},{t:'Il ne peut rien dire du tout.',no:'Il peut produire des phrases, mais sans ressentir.'}],
      why:'Une IA peut produire des phrases qui ressemblent à de l’empathie, mais elle ne ressent pas d’émotions. Les vrais amis, ce sont les humains !'}];
  const items=young()?all.slice(0,4):all,n=items.length;G.total=n;
  const intro='L’IA peut être une super aide, à condition de rester malin. Que ferais-tu dans ces situations ?';
  say(intro,'happy');
  (function step(k){
    if(k>=n)return win(6);
    setProg(k,n);const sc=items[k],opts=shuffle(sc.o);$('#fb').innerHTML='';
    $('#stage').innerHTML=`<div class="card prompt"><div class="bigemoji" style="font-size:3.6rem" aria-hidden="true">${sc.e}</div><h2 style="font-size:1.25rem">${sc.q}</h2></div>
      <div class="choices col">${opts.map((o,i)=>`<button class="choice wide" data-k="${i}"><span>${['🅰️','🅱️','🅲'][i]||'•'}</span><span>${o.t}</span></button>`).join('')}</div>`;
    ask(`${sc.q} ${opts.map((o,i)=>`Réponse ${['A','B','C'][i]} : ${o.t}`).join(' ')}`,k===0?intro+' ':'');
    bindChoices(b=>!!opts[+b.dataset.k].ok,(b,ok)=>ok?sc.why:`${opts[+b.dataset.k].no} ${sc.why}`,()=>step(k+1));
  })(0);
}

/* ---------- Diplôme ---------- */
function diploma(){
  if(!worlds.every((_,i)=>done(i)))return showMap();
  const date=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}),[ri,rn]=rank();
  view(`<section class="game"><div class="noprint gbar"><button class="btn alt sm" onclick="showMap()">← Carte</button></div>
    <article class="diploma"><div class="hero-pix">${pix('cheer',110)}</div><small>Super diplôme de</small><h1>Explorateur de l’IA</h1><p>décerné à</p>
    <div class="dip-name">${esc(S.name||'Super explorateur')}</div>
    <p>pour avoir terminé les 7 mondes, compris ce qu’est l’IA<br>et gardé son esprit critique.</p>
    <div class="bigstars" aria-hidden="true"><span class="on">★</span><span class="on">★</span><span class="on">★</span></div>
    <p><b>${totalStars()} / 21 étoiles</b> · ${ri} ${rn}<br>${date}</p><p style="font-size:1.4rem">🤖 PIX</p></article>
    <div class="btnrow noprint"><button class="btn big" onclick="window.print()">🖨️ Imprimer mon diplôme</button><button class="btn alt" onclick="showMap()">🗺️ Retour à la carte</button></div></section>`);
  sfx.win();burst(220);
}

if(!skinOpen(skins.find(k=>k.id===S.skin)||skins[0])||!SK[S.skin])S.skin='base';
renderTools();home();
</script>
